name: Probe Commons ledgers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe ledger and feed endpoints
        run: |
          set -euxo pipefail
          mkdir -p /tmp/ledger-probe
          base='https://api.commonsmade.com/game/events/genesis'
          uid='c665a7cf-2b83-4323-b4c1-fb40bad01cec'
          curl -L --compressed -A 'Mozilla/5.0' -sS "$base/participants/$uid/ledger" -o /tmp/ledger-probe/participant.json
          curl -L --compressed -A 'Mozilla/5.0' -sS "$base/feed?limit=100" -o /tmp/ledger-probe/feed100.json
          curl -L --compressed -A 'Mozilla/5.0' -sS "$base/feed?limit=100&offset=100" -o /tmp/ledger-probe/feed100offset.json
          curl -L --compressed -A 'Mozilla/5.0' -sS "$base/feed?limit=50&author_handle=onchainmo" -o /tmp/ledger-probe/feed-author.json
          curl -L --compressed -A 'Mozilla/5.0' -sS "$base/feed?limit=50&target_handle=CyphrGM" -o /tmp/ledger-probe/feed-target.json
          curl -L --compressed -A 'Mozilla/5.0' -sS "$base/feed?limit=50&kind=vouch" -o /tmp/ledger-probe/feed-kind.json
          python - <<'PY'
          import json,glob,os
          for path in sorted(glob.glob('/tmp/ledger-probe/*.json')):
              try:
                  d=json.load(open(path))
              except Exception as e:
                  print(path,'ERR',e); continue
              es=d.get('entries',[]) if isinstance(d,dict) else []
              print('\n===',os.path.basename(path),'===')
              print('keys', list(d.keys()) if isinstance(d,dict) else type(d))
              print('count',len(es),'board_version',d.get('board_version') if isinstance(d,dict) else None)
              for e in es[:8]:
                  t=e.get('target') or {}
                  print(e.get('kind'),e.get('author_handle'),'->',t.get('x_handle'),e.get('points'),e.get('tweet_created_at'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: commons-ledger-probe
          path: /tmp/ledger-probe
