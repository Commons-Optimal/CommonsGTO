name: Probe Commons ledgers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe historical feed access
        run: |
          set -euxo pipefail
          mkdir -p /tmp/ledger-probe
          base='https://api.commonsmade.com/game/events/genesis'
          for q in \
            'feed?sort=latest&limit=100' \
            'feed?sort=latest&limit=1000' \
            'feed?sort=latest&limit=100&board_version=9000' \
            'feed?sort=latest&limit=100&board_version=8500' \
            'feed?sort=oldest&limit=100'; do
            name=$(echo "$q" | tr '?&=' '____')
            curl -L --compressed -A 'Mozilla/5.0' -sS "$base/$q" -o "/tmp/ledger-probe/$name.json"
          done
          python - <<'PY'
          import json,glob,os
          for path in sorted(glob.glob('/tmp/ledger-probe/*.json')):
              d=json.load(open(path)); es=d.get('entries',[])
              print('\n===',os.path.basename(path),'===')
              print('count',len(es),'board_version',d.get('board_version'),'sort',d.get('sort'))
              if es:
                  print('first',es[0].get('tweet_id'),es[0].get('tweet_created_at'),es[0].get('author_handle'))
                  print('last ',es[-1].get('tweet_id'),es[-1].get('tweet_created_at'),es[-1].get('author_handle'))
                  cy=[e for e in es if (e.get('author_handle') or '').lower()=='cyphrgm']
                  print('CyphrGM outgoing in response',len(cy))
                  for e in cy: print(e.get('kind'),(e.get('target') or {}).get('x_handle'),e.get('points'),e.get('tweet_created_at'))
          PY
