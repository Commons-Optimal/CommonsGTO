name: Probe Commons ledgers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Commons activity endpoints
        run: |
          set -euxo pipefail
          mkdir -p /tmp/ledger-probe
          curl -L --compressed -A 'Mozilla/5.0' -sS 'https://commonsmade.com/vouch' -o /tmp/ledger-probe/page.html
          asset=$(grep -oE 'src="/assets/index-[^"]+\.js"' /tmp/ledger-probe/page.html | head -1 | cut -d'"' -f2)
          echo "ASSET=$asset"
          curl -L --compressed -A 'Mozilla/5.0' -sS "https://commonsmade.com$asset" -o /tmp/ledger-probe/app.js
          python - <<'PY'
          import re
          s=open('/tmp/ledger-probe/app.js',errors='ignore').read()
          terms=['/feed','/ledger','author_handle','target_handle','outgoing','vouchesRemaining','vouch_total','participants/','targets/']
          for term in terms:
              print('\n###',term)
              for m in list(re.finditer(re.escape(term),s))[:20]:
                  a=max(0,m.start()-500); b=min(len(s),m.end()+800)
                  print(s[a:b].replace('\n',' ')[:1400])
                  print('\n---')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: commons-ledger-probe
          path: /tmp/ledger-probe
